<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Электропитание — решебник</title>
<style>
:root{--bg:#0b0d10;--s:#12161b;--s2:#181d24;--t:#e7eaee;--m:#8a93a0;--l:#232a33;--a:#7cc4ff;--g:#7be0a8;--w:#ffc46b;--c1:#7cc4ff;--c2:#ffc46b;--c3:#7be0a8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{padding:22px 16px 10px;max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px;font-weight:650;letter-spacing:.2px}
.sub{color:var(--m);font-size:13px}
.sub b{color:var(--a);font-weight:600}
nav{position:sticky;top:0;z-index:5;background:rgba(11,13,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--l)}
.tabs{max-width:980px;margin:0 auto;display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--s);color:var(--m);border:1px solid var(--l);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.tabs button:hover{color:var(--t)}
.tabs button.on{background:var(--a);color:#06121c;border-color:var(--a);font-weight:600}
.tabs .sep{flex:none;width:1px;background:var(--l);margin:4px 2px}
main{max-width:980px;margin:0 auto;padding:6px 16px 60px}
section{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:18px;margin:18px 0 4px}
h3{font-size:12px;margin:22px 0 8px;color:var(--m);text-transform:uppercase;letter-spacing:.9px;font-weight:600}
.goal{color:var(--m);margin:0 0 6px}
.card{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:12px 14px}
.scroll{overflow-x:auto;border:1px solid var(--l);border-radius:12px;background:var(--s)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--l)}
tr:last-child td{border-bottom:0}
thead th{background:var(--s2);color:var(--m);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--s2);color:var(--m);border-right:1px solid var(--l)}
td.hl{color:var(--g);font-weight:600}
.step{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:8px 0;border-bottom:1px solid var(--l);align-items:baseline}
.step:last-child{border-bottom:0}
.step .n{grid-column:1/-1;color:var(--m);font-size:12.5px}
.step .f{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:#c9d1db;overflow-wrap:anywhere}
.step .r{font-weight:650;color:var(--g);text-align:right;white-space:nowrap}
.note{border-left:3px solid var(--w);padding:6px 12px;margin:10px 0;color:#d9c9a8;background:rgba(255,196,107,.06);border-radius:0 8px 8px 0;font-size:13.5px}
.ok{border-left-color:var(--g);color:#bfe9d1;background:rgba(123,224,168,.06)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--s2);border:1px solid var(--l);border-radius:8px;padding:6px 10px;font-size:13px}
.chip b{color:var(--a)}
details{background:var(--s);border:1px solid var(--l);border-radius:10px;margin:6px 0;padding:0 12px}
summary{cursor:pointer;padding:10px 0;font-size:14px}
details p{margin:0 0 10px;color:#c3cad4;font-size:14px}
ul.c{margin:6px 0;padding-left:18px}
ul.c li{margin:4px 0}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
svg text{fill:var(--m);font-size:10px;font-family:inherit}
svg .ax{stroke:var(--l)}
svg .gr{stroke:#1a2027}
.leg{display:flex;gap:12px;font-size:12px;color:var(--m);margin:2px 4px 8px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cap{font-size:12.5px;color:var(--m);margin:0 0 6px 2px}
.scheme{display:flex;justify-content:center;background:var(--s);border:1px solid var(--l);border-radius:12px;padding:8px}
.scheme svg{max-width:100%;height:auto}
.scheme svg *{stroke:#cfd6df;fill:none;stroke-width:1.5}
.scheme svg text{fill:#9aa4b2;stroke:none;font-size:11px}
.scheme svg .dot{fill:#cfd6df}
.scheme svg .fl{fill:#cfd6df}
</style>
</head>
<body>
<header>
<h1>Электропитание · решебник</h1>
<div class="sub">Вариант <b>13</b> → по таблицам методички <b>вариант 3</b> (13 − 10) · 5 лабораторных + 3 практических</div>
</header>
<nav><div class="tabs" id="tabs"></div></nav>
<main id="main"></main>

<script>
const D = {"lab1": {"half": [{"U0": 49.10808536264078, "I0": 0.0, "U2": 110.0, "I2": 0.0, "I1": 0.0, "eta": 0.0, "col": "XX"}, {"U0": 43.846504788072124, "I0": 4.384650478807212, "U2": 109.02881333737629, "I2": 6.8982256643851425, "I1": 3.4491128321925713, "eta": 0.2533610651446464, "col": 100}, {"U0": 42.70268292403546, "I0": 5.337835365504432, "U2": 108.81885344484783, "I2": 8.397839939251478, "I1": 4.198919969625739, "eta": 0.2467516460539165, "col": 80}, {"U0": 40.92340446886732, "I0": 6.820567411477887, "U2": 108.49308954529745, "I2": 10.73057325571022, "I1": 5.36528662785511, "eta": 0.23647032746833677, "col": 60}, {"U0": 37.77545027895444, "I0": 9.44386256973861, "U2": 107.91927003632472, "I2": 14.857716815598767, "I1": 7.428858407799384, "eta": 0.21828030227846457, "col": 40}, {"U0": 30.692553351650485, "I0": 15.346276675825242, "U2": 106.6402476235329, "I2": 24.143789825347998, "I1": 12.071894912673999, "eta": 0.1773527456012525, "col": 20}, {"U0": 22.32185698301853, "I0": 22.32185698301853, "U2": 105.15091150395017, "I2": 35.11823974596072, "I1": 17.55911987298036, "eta": 0.12898381498272904, "col": 10}, {"U0": 0.0, "I0": 40.92340446886732, "U2": 101.30487213051, "I2": 64.38343953426133, "I1": 32.191719767130664, "eta": 0.0, "col": 0}], "ct": [{"U0": 98.21617072528156, "I0": 0.0, "U2": null, "I2": null, "I1": 0.0, "eta": 0.0, "col": "XX"}, {"U0": 87.69300957614425, "I0": 8.769300957614425, "U2": null, "I2": null, "I1": 4.877782145441811, "eta": 0.7166133090097045, "col": 100}, {"U0": 85.40536584807091, "I0": 10.675670731008864, "U2": null, "I2": null, "I1": 5.938169568363944, "eta": 0.6979190487746688, "col": 80}, {"U0": 81.84680893773464, "I0": 13.641134822955772, "U2": null, "I2": null, "I1": 7.587661115131706, "eta": 0.6688390884090576, "col": 60}, {"U0": 75.55090055790888, "I0": 18.88772513947722, "U2": null, "I2": null, "I1": 10.505992313259284, "eta": 0.6173899277622068, "col": 40}, {"U0": 61.38510670330097, "I0": 30.692553351650485, "U2": null, "I2": null, "I1": 17.072237509046335, "eta": 0.5016293163067932, "col": 20}, {"U0": 44.64371396603706, "I0": 44.64371396603706, "U2": null, "I2": null, "I1": 24.832345467703764, "eta": 0.36482132095039493, "col": 10}], "bridge": [{"U0": 97.40029813776245, "I0": 0.0, "U2": null, "I2": null, "I1": 0.0, "eta": 0.0, "col": "XX"}, {"U0": 95.30361853010021, "I0": 0.9530361853010021, "U2": null, "I2": null, "I1": 0.530948145192289, "eta": 0.7775780491744313, "col": 100}, {"U0": 94.79347750633812, "I0": 1.1849184688292265, "U2": null, "I2": null, "I1": 0.6601326087427242, "eta": 0.7734158309063445, "col": 80}, {"U0": 93.95527151552645, "I0": 1.5659211919254408, "U2": null, "I2": null, "I1": 0.8723938977275231, "eta": 0.7665769449417383, "col": 60}, {"U0": 92.32255747655208, "I0": 2.308063936913802, "U2": null, "I2": null, "I1": 1.2858507212950694, "eta": 0.7532557026125775, "col": 40}, {"U0": 87.74801634032653, "I0": 4.387400817016326, "U2": null, "I2": null, "I1": 2.4442747945338708, "eta": 0.7159322218524948, "col": 20}, {"U0": 79.8363099489856, "I0": 7.983630994898561, "U2": null, "I2": null, "I1": 4.447778724479667, "eta": 0.6513809559477616, "col": 10}, {"U0": 0.0, "I0": 44.27286278989201, "U2": null, "I2": null, "I1": 24.664954744841786, "eta": 0.0, "col": 0}]}, "lab1_ri": {"half": 1.2000000000000002, "ct": 1.2000000000000002, "bridge": 2.1999999999999904}, "lab2": {"half": {"none": {"U1m": 7.9555008524011415, "Ud": 4.9932117684698945, "Umax": 16.13442832015699, "Umin": 0.0, "p": 1.5932632584575923, "q": 1.0}, "C": {"U1m": 0.9316988979253353, "Ud": 14.795268629570492, "Umax": 16.125917997988964, "Umin": 13.464425844281134, "p": 0.06297275982290716, "q": 25.300832660632764}, "LC": {"U1m": 0.9646590341947724, "Ud": 15.236571976470776, "Umax": 16.688321330520427, "Umin": 13.874295629400832, "p": 0.06331207805039457, "q": 25.16523398883545}, "CLC": {"U1m": 0.926122523684686, "Ud": 14.896482866406037, "Umax": 15.931066499629445, "Umin": 13.870244531019145, "p": 0.062170549383387744, "q": 25.62729900667919}}, "ct": {"none": {"U1m": 7.170151681740517, "Ud": 9.986423536939789, "Umax": 16.13442832015699, "Umin": 0.0, "p": 0.7179899445700576, "q": 1.0}, "C": {"U1m": 0.4819996800084258, "Ud": 15.479940023191727, "Umax": 16.125918274840107, "Umin": 14.80055723317444, "p": 0.031137050872697428, "q": 23.05902211180919}, "LC": {"U1m": 0.4966434145689213, "Ud": 15.84965861210932, "Umax": 16.553700746663203, "Umin": 15.175774759270942, "p": 0.03133464427993926, "q": 22.91361402272952}, "CLC": {"U1m": 0.24537715444679234, "Ud": 15.358626506318549, "Umax": 15.601726115883105, "Umin": 15.114422132539671, "p": 0.01597650378084551, "q": 44.94036708024114}}, "bridge": {"none": {"U1m": 7.0876961366909645, "Ud": 9.19589084374918, "Umax": 15.299962822831478, "Umin": 0.0, "p": 0.7707460057019663, "q": 1.0}, "C": {"U1m": 0.4555553239253381, "Ud": 14.655605769128396, "Umax": 15.266779549284697, "Umin": 14.02222425216666, "p": 0.03108403235606624, "q": 24.79556052680374}, "LC": {"U1m": 0.4654745770842986, "Ud": 14.892197757247189, "Umax": 15.542974043409888, "Umin": 14.26275191357202, "p": 0.03125627155050224, "q": 24.658923392594517}, "CLC": {"U1m": 0.23217642348750314, "Ud": 14.555040142085453, "Umax": 14.785080968249323, "Umin": 14.323944357814073, "p": 0.01595161684344464, "q": 48.31773564187046}}}, "lab3": [{"R": 10, "Uin": 1.3192307692307694, "Iin": 0.8974358974358975, "Uout": 0.8974358974358976, "In": 0.8974358974358976, "Ist": -1.1102230246251565e-16}, {"R": 20, "Uin": 2.5251533742331294, "Iin": 1.7177914110429446, "Uout": 1.717791411042945, "In": 1.717791411042945, "Ist": -4.440892098500626e-16}, {"R": 30, "Uin": 3.6750000000000003, "Iin": 2.5, "Uout": 2.5, "In": 2.5, "Ist": 0.0}, {"R": 40, "Uin": 4.814035087719299, "Iin": 3.2748538011695913, "Uout": 3.2748538011695905, "In": 3.2748538011695905, "Ist": 8.881784197001252e-16}, {"R": 50, "Uin": 5.982558110837658, "Iin": 4.069767556649366, "Uout": 4.069767359212456, "In": 4.069767359212456, "Ist": 1.9743691037632516e-07}, {"R": 60, "Uin": 7.138519220087704, "Iin": 5.256169916301235, "Uout": 4.668119359426123, "In": 4.668119359426123, "Ist": 0.5880505568751113}, {"R": 70, "Uin": 8.236424153923265, "Iin": 7.445599267032063, "Uout": 4.736992498418196, "In": 4.736992498418196, "Ist": 2.7086067686138664}, {"R": 80, "Uin": 9.568348293473507, "Iin": 10.197823165790586, "Uout": 4.775371405551931, "In": 4.775371405551931, "Ist": 5.422451760238655}, {"R": 90, "Uin": 11.348288178740352, "Iin": 13.907909125107196, "Uout": 4.81157088993997, "In": 4.81157088993997, "Ist": 9.096338235167226}, {"R": 100, "Uin": 14.0, "Iin": 19.455402738529244, "Uout": 4.855960712891255, "In": 4.855960712891255, "Ist": 14.59944202563799}]};
const f=(x,d=2)=>Number(x).toFixed(d).replace('.',',');
const ceil=Math.ceil;

/* ---------- helpers ---------- */
function tbl(head,rows){
  return '<div class="scroll"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
   rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i==0?'':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function step(n,form,res){return '<div class="step"><div class="n">'+n+'</div><div class="f">'+form+'</div><div class="r">'+res+'</div></div>'}
function steps(a){return '<div class="card">'+a.join('')+'</div>'}
function note(t,c=''){return '<div class="note '+c+'">'+t+'</div>'}
function qa(list){return '<h3>Контрольные вопросы</h3>'+list.map(([q,a])=>'<details><summary>'+q+'</summary><p>'+a+'</p></details>').join('')}
function chips(a){return '<div class="chips">'+a.map(x=>'<div class="chip">'+x+'</div>').join('')+'</div>'}
function concl(items){return '<h3>Выводы</h3><div class="card"><ul class="c">'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>'}
const COL=['var(--c1)','var(--c2)','var(--c3)'];
function chart(title,series,xl,yl,opt={}){
  const W=420,H=240,L=44,R=12,T=14,B=34;
  let xs=[],ys=[];series.forEach(s=>s.p.forEach(q=>{xs.push(q[0]);ys.push(q[1])}));
  const xmin=opt.xmin!=null?opt.xmin:Math.min(0,...xs), xmax=Math.max(...xs)*1.04;
  const ymin=opt.ymin!=null?opt.ymin:Math.min(0,...ys), ymax=Math.max(...ys)*1.08||1;
  const X=v=>L+(v-xmin)/(xmax-xmin)*(W-L-R), Y=v=>H-B-(v-ymin)/(ymax-ymin)*(H-B-T);
  let g='';
  for(let i=0;i<=4;i++){
    const yv=ymin+(ymax-ymin)*i/4, xv=xmin+(xmax-xmin)*i/4;
    g+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(yv)+'" y2="'+Y(yv)+'"/><text x="'+(L-6)+'" y="'+(Y(yv)+3)+'" text-anchor="end">'+(+yv.toFixed(2))+'</text>';
    g+='<text x="'+X(xv)+'" y="'+(H-B+14)+'" text-anchor="middle">'+(+xv.toFixed(1))+'</text>';
  }
  g+='<line class="ax" x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(H-B)+'"/><line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'"/>';
  g+='<text x="'+((L+W-R)/2)+'" y="'+(H-4)+'" text-anchor="middle">'+xl+'</text><text x="10" y="'+((T+H-B)/2)+'" transform="rotate(-90 10 '+((T+H-B)/2)+')" text-anchor="middle">'+yl+'</text>';
  series.forEach((s,k)=>{
    const d=s.p.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join('');
    g+='<path d="'+d+'" fill="none" stroke="'+COL[k]+'" stroke-width="2" stroke-linejoin="round"/>';
    s.p.forEach(q=>g+='<circle cx="'+X(q[0]).toFixed(1)+'" cy="'+Y(q[1]).toFixed(1)+'" r="2.6" fill="'+COL[k]+'"/>');
  });
  const leg=series.length>1||series[0].n?'<div class="leg">'+series.map((s,k)=>'<span><i style="background:'+COL[k]+'"></i>'+s.n+'</span>').join('')+'</div>':'';
  return '<div><div class="cap">'+title+'</div><div class="card" style="padding:6px"><svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg></div>'+leg+'</div>';
}

/* ---------- LAB 1 ---------- */
function lab1(){
  const col=c=>c=='XX'?'XX':c;
  const mk=(rows,keys)=>{
    const head=['Rн, %'].concat(rows.map(r=>col(r.col)));
    const lab={U0:'U0, В',I0:'I0, А',U2:'U2, В',I2:'I2, А',I1:'I1, А',U1:'U1, В',eta:'η = P0/P1'};
    const body=keys.map(k=>[lab[k]].concat(rows.map(r=>{
      if(k=='U1')return '220';
      if(k=='eta')return f(r.eta,2);
      if(k=='I0'&&r.col=='XX')return '≈0';
      if(k=='I1'&&r.col=='XX')return '≈0';
      if(k=='I2'&&r.col=='XX')return '≈0';
      const v=r[k];return v==null?'—':f(v,k=='U0'||k=='U2'?1:3);
    })));
    return tbl(head,body);
  };
  const pts=(rows,y)=>rows.filter(r=>r.col!='XX'&&r.col!=0).map(r=>[r.I0,y(r)]).sort((a,b)=>a[0]-b[0]);
  const A=D.lab1.half,B=D.lab1.ct,C=D.lab1.bridge;
  const sers=y=>[{n:'однополупериодный',p:pts(A,y)},{n:'с нулевой точкой',p:pts(B,y)},{n:'мостовой',p:pts(C,y)}];
  return `
  <h2>Лабораторная работа №1</h2>
  <p class="goal">Исследование основных схем выпрямителей: КПД, внутреннее сопротивление, внешняя характеристика.</p>
  ${chips(['U1 = 220 В / 50 Гц','N = 2 → U2хх = 110 В','r2 = 0,2 Ом','диод: Uпор 0,82 В, Rд 1 Ом'])}
  <h3>Таблица 1 · однополупериодный (Rн max = 10 Ом)</h3>${mk(A,['U0','I0','U2','I2','I1','U1','eta'])}
  <h3>Таблица 2 · двухполупериодный с нулевой точкой (Rн max = 10 Ом)</h3>${mk(B,['U0','I0','I1','U1','eta'])}
  <h3>Таблица 3 · мостовой (Rн max = 100 Ом)</h3>${mk(C,['U0','I0','I1','U1','eta'])}
  ${note('Значения получены расчётом по модели схемы (параметры выше). Сверь с показаниями приборов в EWB и при расхождении подставь свои.')}
  <h3>Внутреннее сопротивление</h3>
  ${steps([step('Ri = (U0(100%) − U0(20%)) / (I0(20%) − I0(100%))','',''),
    step('Однополупериодный','',f(D.lab1_ri.half,1)+' Ом'),step('С нулевой точкой','',f(D.lab1_ri.ct,1)+' Ом'),step('Мостовой','',f(D.lab1_ri.bridge,1)+' Ом')])}
  <h3>Графики</h3>
  <div class="charts">${chart('U0 = f(I0)',sers(r=>r.U0),'I0, А','U0, В')}${chart('η = f(I0)',sers(r=>r.eta),'I0, А','η')}</div>
  ${concl([
   'Выходное напряжение падает с ростом тока: U0 хх ≈ '+f(A[0].U0,0)+' / '+f(B[0].U0,0)+' / '+f(C[0].U0,0)+' В (однопол. / с нулём / мост).',
   'Ri ≈ '+f(D.lab1_ri.half,1)+' / '+f(D.lab1_ri.ct,1)+' / '+f(D.lab1_ri.bridge,1)+' Ом; у моста выше из-за двух диодов в цепи тока.',
